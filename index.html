<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Cool Random TSTC Program Randomizer</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="app">
        <canvas id="three-canvas"></canvas>
        
        <!-- Start Screen with 2D Skyline Background -->
        <div id="start-screen">
            <canvas id="skyline-canvas"></canvas>
            <div id="start-content">
                <h1 id="title">TSTC</h1>
                <h2 id="subtitle">Super Random Program Randomizer</h2>
                <button id="start-button">START</button>
            </div>
        </div>
        
        <div id="ui-overlay">
            <div id="phase-indicator"></div>
            <div id="instructions"></div>
            <div id="hangman-input" style="display: none;">
                <div id="keyboard-display"></div>
            </div>
            <div id="virtual-keyboard" style="display: none;"></div>
        </div>
        <div id="loading-screen">
            <h1>Loading Super Cool Random TSTC Program Randomizer...</h1>
            <div class="loader"></div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
